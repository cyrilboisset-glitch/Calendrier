name: APK Android

on:
  push:
    paths: ['www/**', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compiler l'APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk calendrier-conges.apk

      - uses: actions/upload-artifact@v4
        with:
          name: calendrier-conges-apk
          path: calendrier-conges.apk

      - name: Publier la version (page Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Calendrier congés 2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK à installer sur Android : **calendrier-conges.apk** ci-dessous.
            Les mises à jour s'installent par-dessus la version précédente sans perdre les données.
          files: calendrier-conges.apk
